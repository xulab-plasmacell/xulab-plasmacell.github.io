<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" role="img" aria-labelledby="t4 d4">
<title id="t4">How long each vaccine protects</title>
<desc id="d4">Horizontal bars showing typical duration of protection: smallpox beyond a lifetime, measles decades, HPV ten years and counting, tetanus about ten years, influenza and COVID-19 only a few months.</desc>
<rect width="880" height="480" fill="#fffdf9"/>
<text x="32" y="50" font-family="Segoe UI, -apple-system, Arial, sans-serif" font-size="22" font-weight="700" fill="#1b2733">One immune system, very different lifespans</text>
<text x="32" y="78" font-family="Segoe UI, -apple-system, Arial, sans-serif" font-size="14" fill="#7c8b98">Typical duration of protection on one linear scale &#8212; note how short the last two are</text>

<g stroke="#eef1f4" stroke-width="1.2" stroke-dasharray="2 7">
  <line x1="250" y1="104" x2="250" y2="410"/>
  <line x1="367" y1="104" x2="367" y2="410"/>
  <line x1="485" y1="104" x2="485" y2="410"/>
  <line x1="602" y1="104" x2="602" y2="410"/>
  <line x1="720" y1="104" x2="720" y2="410"/>
</g>

<g font-family="Segoe UI, -apple-system, Arial, sans-serif" font-size="15" fill="#1b2733" text-anchor="end">
  <text x="232" y="137">Smallpox</text>
  <text x="232" y="189">Measles</text>
  <text x="232" y="241">HPV</text>
  <text x="232" y="293">Tetanus</text>
  <text x="232" y="345">Influenza</text>
  <text x="232" y="397">COVID-19</text>
</g>

<rect x="250" y="120" width="470" height="24" rx="8" fill="#2f7a63"/>
<path d="M722 132 L858 132" stroke="#2f7a63" stroke-width="2" stroke-dasharray="3 6"/>
<text x="730" y="112" font-family="Segoe UI, -apple-system, Arial, sans-serif" font-size="13" font-weight="600" fill="#2f7a63">beyond a lifetime</text>

<rect x="250" y="172" width="352" height="24" rx="8" fill="#0b5a8f"/>
<text x="614" y="189" font-family="Segoe UI, -apple-system, Arial, sans-serif" font-size="13.5" fill="#5c6b7a">decades</text>

<rect x="250" y="224" width="368" height="24" rx="8" fill="#6d63a8"/>
<text x="630" y="241" font-family="Segoe UI, -apple-system, Arial, sans-serif" font-size="13.5" fill="#5c6b7a">10 years and counting</text>

<rect x="250" y="276" width="368" height="24" rx="8" fill="#c98a3d"/>
<text x="630" y="293" font-family="Segoe UI, -apple-system, Arial, sans-serif" font-size="13.5" fill="#5c6b7a">about 10 years &#183; booster</text>

<rect x="250" y="328" width="18" height="24" rx="7" fill="#bf5b4e"/>
<text x="280" y="345" font-family="Segoe UI, -apple-system, Arial, sans-serif" font-size="13.5" fill="#bf5b4e">a few months &#183; annual reformulation</text>

<rect x="250" y="380" width="20" height="24" rx="7" fill="#d97742"/>
<text x="282" y="397" font-family="Segoe UI, -apple-system, Arial, sans-serif" font-size="13.5" fill="#d97742">a few months &#183; boosters</text>

<line x1="250" y1="414" x2="720" y2="414" stroke="#dfe6ec" stroke-width="1.6"/>
<g font-family="Segoe UI, -apple-system, Arial, sans-serif" font-size="12.5" fill="#8b99a6" text-anchor="middle">
  <text x="250" y="438">0</text><text x="367" y="438">10</text><text x="485" y="438">20</text><text x="602" y="438">30</text><text x="720" y="438">40</text>
</g>
<text x="720" y="462" text-anchor="end" font-family="Segoe UI, -apple-system, Arial, sans-serif" font-size="12.5" fill="#8b99a6">years of protection</text>
<text x="32" y="462" font-family="Segoe UI, -apple-system, Arial, sans-serif" font-size="12" fill="#a6b2bc">Schematic summary of published durability data.</text>
</svg>
